# Release workflow: build, test, code-sign and publish a draft GitHub release.
#
# Triggered by pushing a tag like v0.1.0-alpha.2 (must match the version in
# Cargo.toml). The exe is signed with the Computer Works certificate through
# Azure Artifact Signing (formerly Trusted Signing) using GitHub's OIDC token,
# so no key material or client secret is stored anywhere.
#
# One-time setup: tools/setup-ci-signing.ps1 (creates the Entra app, federated
# credential, role assignment, the "release" environment and its secrets).
# The job runs in the "release" environment; add required reviewers there if you
# want a manual approval before anything is signed with the company certificate.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the draft release
  id-token: write # Azure federated (OIDC) login

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    environment: release

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Test sound index builder
        run: cargo test --release --manifest-path tools/sfxindex/Cargo.toml

      - name: Build
        run: cargo build --release

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign executable (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: computerworksrmmsign
          certificate-profile-name: ComputerWorksRMM
          files-folder: ${{ github.workspace }}\target\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: OBR Music Tool (free, open-source)
          description-url: https://github.com/LorexValkin/OBR-Music-Tool
          exclude-environment-credential: false
          exclude-workload-identity-credential: false
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature target\release\obr-music-tool.exe
          Write-Host "Status : $($sig.Status)"
          Write-Host "Signer : $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Signature status is $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'CN=Computer Works') { throw 'Unexpected signer' }
          if (-not $sig.TimeStamperCertificate) { throw 'Signature is not timestamped' }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist\OBR-Music-Tool-$tag-windows-x64.zip"
          Compress-Archive -Path target\release\obr-music-tool.exe, LICENSE, README.md -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item target\release\obr-music-tool.exe dist\obr-music-tool.exe
          Get-FileHash -Algorithm SHA256 dist\* | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Create draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/OBR-Music-Tool-*-windows-x64.zip
            dist/obr-music-tool.exe
            dist/SHA256SUMS.txt

      - name: Upload artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: obr-music-tool-signed
          path: dist/
